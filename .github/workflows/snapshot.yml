name: Snapshot semanal del fondo

# Viernes 09:00 UTC = 06:00 en Argentina (UTC-3, sin horario de verano).
# GitHub puede demorar la ejecución algunos minutos; para un snapshot semanal es irrelevante.
on:
  schedule:
    - cron: "0 9 * * 5"
  workflow_dispatch: {}      # permite dispararlo a mano desde la pestaña "Actions"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install sqlalchemy requests "psycopg[binary]"
      - name: Registrar snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python snapshot.py
